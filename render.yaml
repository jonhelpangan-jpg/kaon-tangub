# Deploy on Render (render.com): New > Blueprint > pick this repository.
# After the first deploy, add the settings described in SETUP-LOGIN.md under
# the service's Environment tab (DATABASE_URL, GOOGLE_CLIENT_ID, ADMIN_EMAILS, SESSION_SECRET).
services:
  - type: web
    name: kaon-tangub
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:web
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
